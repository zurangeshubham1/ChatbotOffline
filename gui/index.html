<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CodeLocal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <div class="atmosphere" aria-hidden="true"></div>

  <div class="shell">
    <header class="top">
      <div class="brand-block">
        <p class="brand">CodeLocal</p>
        <p class="tagline">Offline coding assistant on your machine</p>
      </div>
      <div class="meta">
        <span id="status" class="status">Connecting…</span>
        <select id="model" class="model" aria-label="Model"></select>
        <button type="button" id="clear" class="ghost" title="Clear chat">Clear</button>
      </div>
    </header>

    <main id="thread" class="thread" aria-live="polite"></main>

    <footer class="composer">
      <form id="form" class="form">
        <label class="sr-only" for="input">Message</label>
        <textarea
          id="input"
          rows="1"
          placeholder="Ask for code, debug help, or an explanation…"
          autocomplete="off"
        ></textarea>
        <button type="submit" id="send" class="send" disabled>Send</button>
      </form>
      <p class="hint">Enter to send · Shift+Enter for new line · Local only, no cloud</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
